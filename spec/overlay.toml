[[add]]
name = "api-keys.introspect"
key = "POST /api-keys/v1/introspect"
method = "POST"
server = "apis"
path = "/api-keys/v1/introspect"
summary = "Describe an API key: its scopes, owner, and whether it is enabled or expired."
auth = { bodykey = { field = "apiKey" } }
stability = "unspecified"
safety = "read"
response = { type = "json", shape = { type = "any" } }
body = { required = true, media = { type = "json", content_type = "application/json", shape = { type = "object", fields = [{ name = "apiKey", required = true, shape = { type = "string" } }] } } }
patches = ["Missing from the spec. Documented at https://create.roblox.com/docs/cloud/auth/api-keys."]

[[add]]
name = "universes.get-place-universe"
key = "GET /universes/v1/places/{placeId}/universe"
method = "GET"
server = "apis"
path = "/universes/v1/places/{placeId}/universe"
summary = "Get the universe that owns a place."
auth = "none"
stability = "unspecified"
safety = "read"
params = [{ name = "placeId", in = "path", required = true, kind = { type = "integer" } }]
response = { type = "json", shape = { type = "object", fields = [{ name = "universeId", shape = { type = "integer" } }] } }
patches = ["Missing from the spec. A public endpoint that needs no key."]

[[patch]]
