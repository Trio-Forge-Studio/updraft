name: Spec update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - shell: python
        run: |
          from pathlib import Path
          Path("build").mkdir(exist_ok=True)
      - name: Update the spec with a read-only token
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask spec update > build/spec-update.json
      - name: Build and test the updated spec
        id: checks
        continue-on-error: true
        shell: python
        env:
          UPDRAFT_RUNNER: ${{ matrix.os }}
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path
          commands = [
              ["cargo", "fmt", "--all", "--check"],
              ["cargo", "clippy", "--workspace", "--all-targets", "--locked", "--", "-D", "warnings"],
              ["cargo", "test", "--workspace", "--locked"],
              ["cargo", "xtask", "spec", "check"],
          ]
          checks = [{"command": command, "exit": subprocess.run(command).returncode} for command in commands]
          Path("build/spec-verification.json").write_text(json.dumps({"runner": os.environ["UPDRAFT_RUNNER"], "checks": checks}))
          raise SystemExit(int(any(check["exit"] != 0 for check in checks)))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spec-update-${{ matrix.os }}
          path: |
            spec/openapi.json
            spec/registry.json
            build/spec-update.json
            build/spec-verification.json
          if-no-files-found: error
      - name: Report failed verification
        if: steps.checks.outcome == 'failure'
        run: exit 1

  pull-request:
    needs: verify
    if: ${{ always() && !cancelled() && (needs.verify.result == 'success' || needs.verify.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: spec-update-*
          path: build/verified
      - name: Prepare the verified update and PR body
        shell: python
        run: |
          import json
          import shutil
          from pathlib import Path
          roots = [Path("build/verified") / f"spec-update-{runner}" for runner in ["ubuntu-latest", "windows-latest"]]
          for name in ["openapi.json", "registry.json"]:
              assert (roots[0] / "spec" / name).read_bytes() == (roots[1] / "spec" / name).read_bytes(), "both runners must verify identical spec bytes"
              shutil.copyfile(roots[0] / "spec" / name, Path("spec") / name)
          update = json.loads((roots[0] / "build/spec-update.json").read_text())
          registry = json.loads(Path("spec/registry.json").read_text())
          commit = registry["source"]["commit"]
          lines = [f"Updates the Roblox Open Cloud spec to [{commit}](https://github.com/Roblox/creator-docs/commit/{commit}).", ""]
          lines.extend(["GitHub does not trigger CI on bot PRs created with GITHUB_TOKEN. This workflow's Ubuntu and Windows verification job is the check for this update.", ""])
          for root in roots:
              verification = json.loads((root / "build/spec-verification.json").read_text())
              lines.extend([f"## {verification['runner']}", ""])
              for check in verification["checks"]:
                  command = " ".join(check["command"])
                  lines.append(f"- `{command}` exited {check['exit']}.")
              lines.append("")
          for title, field in [("Added", "added"), ("Removed", "removed"), ("Changed", "changed")]:
              lines.extend([f"## {title}", ""])
              entries = update["diff"][field]
              if not entries:
                  lines.append("None.")
              for entry in entries:
                  if isinstance(entry, str):
                      lines.append(f"- `{entry}`")
                  else:
                      fields = ", ".join(entry["fields"])
                      lines.append(f"- `{entry['name']}`. Changed {fields}.")
              lines.append("")
          Path("build/spec-update.md").write_text("\n".join(lines))
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          token: ${{ github.token }}
          branch: chore/roblox-openapi
          base: main
          title: "chore(spec): update Roblox Open Cloud"
          commit-message: "chore(spec): update Roblox Open Cloud"
          body-path: build/spec-update.md
          add-paths: |
            spec/openapi.json
            spec/registry.json
